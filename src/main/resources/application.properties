spring.application.name=subscription-service
server.port=9097

spring.kafka.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.properties.bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
#spring.kafka.producer.key-serializer: org.apache.kafka.common.serialization.StringSerializer
#spring.kafka.producer.value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
#spring.kafka.producer.acks: all
#spring.kafka.producer.properties.enable.idempotence: true
# Belt-and-suspenders against duplicate sends on retry, though
# consumer-side idempotency (see SubscriptionCreatedEvent.eventId)
# is still needed regardless - Kafka's exactly-once guarantee only
# covers producer retries, not the end-to-end publish-then-consume path.

spring.kafka.admin.fail-fast: false
# Lets KafkaTopicConfig's NewTopic bean actually create the topic on
# startup against a local/dev broker. A real deployment usually
# provisions topics via infrastructure-as-code instead and can leave
# this at its default.


# PostgreSQL connection
spring.datasource.url=jdbc:postgresql://localhost:5432/sub_db
spring.datasource.username=sub_user
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

user-service.url: http://localhost:8090

# Must match user-service's internal.api-key
internal.api-key: sms_12345
